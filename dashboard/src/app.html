<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap"
			rel="stylesheet"
		/>
		<script>
			// Applied synchronously, before first paint, to avoid a flash of the
			// wrong theme. Kept in sync with `src/lib/theme.ts` — see that file
			// for the mode semantics ('light' | 'dark' | 'system').
			(function () {
				try {
					var stored = localStorage.getItem('temperpaw-theme');
					var mode = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
					var resolved =
						mode === 'system'
							? window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light'
							: mode;
					document.documentElement.setAttribute('data-theme', resolved);
				} catch (e) {
					document.documentElement.setAttribute('data-theme', 'dark');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
